
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1511">
<meta name="description" content="Утренние и вечерние азкары: арабский текст, транслитерация, перевод и счётчики.">
<title>Azkar — Азкары</title>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: radial-gradient(ellipse at top, #1b352b, #0b1511 75%);
  color: #f0f5ed;
  text-align: center;
  overflow-wrap: anywhere;
}
h1 { color: #d4e8b5; font-size: 36px; margin-bottom: 10px; }
h2 { color: #c5dfa5; margin-top: 0; }
.subtitle { color: #a8bcae; margin-bottom: 24px; line-height: 1.6; }
.site-header, .page-wrap { max-width: 760px; margin: 0 auto; }
.language-switch {
  display: flex; justify-content: center; align-items: center;
  flex-wrap: wrap; gap: 8px; margin: 0 auto 18px;
}
.language-switch button {
  margin: 0; min-height: 44px; padding: 10px 16px;
  border-radius: 999px; background: #14251c;
}
button {
  background: linear-gradient(135deg, #608c59, #3d6848);
  color: white; border: 1px solid #71976a; border-radius: 12px;
  padding: 12px 18px; margin: 5px; cursor: pointer; font-size: 15px;
  min-height: 44px; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s, filter .2s;
}
button:hover { filter: brightness(1.15); transform: translateY(-2px); }
button:active { transform: scale(.97); }
button:focus-visible, a:focus-visible {
  outline: 3px solid #d4e8b5; outline-offset: 3px;
}
.home-grid {
  display: grid; grid-template-columns: 1fr; gap: 14px;
  max-width: 620px; margin: 28px auto;
}
.home-link {
  display: block; text-decoration: none; color: inherit; text-align: left;
  border: 1px solid #355747; border-radius: 20px; padding: 22px;
  background: linear-gradient(145deg, rgba(35,73,55,.95), rgba(17,36,28,.96));
  box-shadow: 0 12px 28px rgba(0,0,0,.18);
}
.home-link strong { display: block; font-size: 1.25rem; margin-bottom: 8px; }
.home-link span { color: #c6d8ca; line-height: 1.5; }
.resume-link {
  display: none; margin: 0 auto 18px; padding: 14px 20px;
  border-radius: 999px; background: #c8e6c9; color: #123b2a;
  font-weight: 700; text-decoration: none; border: 1px solid #9ac7a5;
}
@media (min-width: 560px) {
  .home-grid { grid-template-columns: 1fr 1fr; }
  .home-link { min-height: 150px; }
  .page-wrap { padding-left: 8px; padding-right: 8px; }
}
@media (max-width: 600px) {
  body { padding: 18px 12px calc(28px + env(safe-area-inset-bottom)); }
  h1 { font-size: clamp(27px, 7vw, 32px); line-height: 1.25; margin-top: 8px; }
  .subtitle { margin-bottom: 22px; }
  h2 { font-size: 22px; line-height: 1.35; }
  button { padding: 11px 13px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>
<div class="page-wrap">
  <header class="site-header">
    <h1 lang="ar">أذكار | Азкары</h1>
    <div class="language-switch">
      <button type="button" onclick="setLanguage('ru')" lang="ru">Русский</button>
      <button type="button" onclick="setLanguage('inh')" lang="inh">ГӀалгӀай мотт</button>
    </div>
    <p class="subtitle" data-i18n="subtitle">Сайт для поминания Аллаха</p>
    <p id="language-note" class="subtitle" role="status" aria-live="polite" hidden></p>
  </header>

  <main>
    <a class="resume-link" id="resume-link" href="morning.html">▶ Продолжить</a>
    <p>Выбери нужный раздел</p>
    <nav class="home-grid" aria-label="Разделы азкаров">
      <a class="home-link" href="morning.html">
        <strong>☀ Утренние азкары</strong>
        <span>Зикр для начала дня и ежедневное поминание Аллаха.</span>
      </a>
      <a class="home-link" href="evening.html">
        <strong>☾ Вечерние азкары</strong>
        <span>Вечерние поминания с транслитерацией, переводом и счётчиками.</span>
      </a>
    </nav>
    <p class="subtitle">Прогресс повторений сохраняется на этом устройстве.</p>
  </main>
</div>

<script>
const lastPage = localStorage.getItem("azkar-last-page");
const resumeLink = document.getElementById("resume-link");

if (lastPage === "morning.html" || lastPage === "evening.html") {
  resumeLink.href = lastPage;
  resumeLink.textContent = lastPage === "morning.html"
    ? "▶ Продолжить утренние азкары"
    : "▶ Продолжить вечерние азкары";
  resumeLink.style.display = "inline-flex";
}

const goals = { morning: 3, morning2: 100, evening: 3, evening2: 1 };
const counts = {};
Object.keys(goals).forEach(type => {
  counts[type] = Number(localStorage.getItem(type + "-count")) || 0;
});

const translations = {
  ru: {
    subtitle: "Сайт для поминания Аллаха",
    quickMorning: "☀ Утренние азкары",
    quickEvening: "☾ Вечерние азкары",
    morningTitle: "Утренние азкары",
    eveningTitle: "Вечерние азкары",
    openSection: "Открыть раздел",
    closeSection: "Закрыть раздел",
    morningDhikr1: "Утренний зикр № 1",
    dailyDhikr: "Дополнительный ежедневный зикр",
    eveningDhikr1: "Вечерний зикр № 1",
    eveningDhikr2: "Вечерний зикр № 2",
    transliteration: "Транслитерация:",
    translation: "Перевод:",
    source: "Источник:",
    completed: "Выполнено:",
    goal: "Цель:",
    dailyGoal: "Цель: 100 повторений в течение дня",
    goalThree: "Цель: 3 повторения",
    remaining: "Осталось:",
    repeatButton: "Повторил",
    resetButton: "Сбросить",
    completeStatus: "Цель достигнута!",
    pending: "Ингушский перевод интерфейса ещё проверяется; непроверенные надписи временно показаны на русском."
  },
  inh: {
    morningTitle: "Ӏуйранара азкара́ш",
    eveningTitle: "Сайранара азкара́ш",
    pending: "Ӏуйранара азкара́ш — утренние азкары; Сайранара азкара́ш — вечерние азкары. Остальные надписи переводятся и проверяются."
  }
};

function currentLanguage() {
  return localStorage.getItem("azkar-language") === "inh" ? "inh" : "ru";
}

function setLanguage(language) {
  const selectedLanguage = language === "inh" ? "inh" : "ru";
  document.documentElement.lang = selectedLanguage === "inh" ? "inh" : "ru";
  localStorage.setItem("azkar-language", selectedLanguage);

  const dictionary = translations[selectedLanguage];
  const fallback = translations.ru;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.getAttribute("data-i18n");
    const value = dictionary[key] || fallback[key];
    if (value && element.children.length === 0) element.textContent = value;
  });

  document.querySelectorAll("[data-counter-toggle]").forEach(button => {
    const isOpen = document.getElementById(button.dataset.counterToggle)?.classList.contains("show");
    button.textContent = isOpen
      ? (dictionary.closeSection || fallback.closeSection)
      : (dictionary.openSection || fallback.openSection);
    button.setAttribute("aria-expanded", String(Boolean(isOpen)));
  });

  const note = document.getElementById("language-note");
  if (note) {
    note.textContent = dictionary.pending || fallback.pending;
    note.hidden = selectedLanguage !== "inh";
  }

  Object.keys(goals).forEach(updateCounter);
}

function updateCounter(type) {
  const counter = document.getElementById(type + "-counter");
  if (!counter) return;

  const remaining = document.getElementById(type + "-remaining");
  const status = document.getElementById(type + "-status");
  counter.textContent = counts[type];

  if (remaining) remaining.textContent = Math.max(0, goals[type] - counts[type]);

  if (status) {
    const done = counts[type] >= goals[type];
    status.textContent = done
      ? (translations[currentLanguage()].completeStatus || translations.ru.completeStatus)
      : "";
    status.className = done ? "complete" : "";
  }

  const progress = document.getElementById(type + "-progress");
  if (progress) progress.style.width = Math.min(100, counts[type] / goals[type] * 100) + "%";
}

function increaseCounter(type) {
  counts[type]++;
  localStorage.setItem(type + "-count", counts[type]);
  updateCounter(type);
}

function resetCounter(type) {
  counts[type] = 0;
  localStorage.setItem(type + "-count", 0);
  updateCounter(type);
}

function toggleDhikr(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("show");

  const btn = document.querySelector('[data-counter-toggle="' + id + '"]');
  if (btn) {
    const dictionary = translations[currentLanguage()];
    const fallback = translations.ru;
    const open = el.classList.contains("show");
    btn.textContent = open
      ? (dictionary.closeSection || fallback.closeSection)
      : (dictionary.openSection || fallback.openSection);
    btn.setAttribute("aria-expanded", String(open));
  }
}

function openAndScrollTo(id) {
  const section = document.getElementById(id);
  if (!section) return;
  section.classList.add("show");
  section.closest(".card")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

window.addEventListener("DOMContentLoaded", () => {
  setLanguage(currentLanguage());
});
</script>
</body>
</html>
